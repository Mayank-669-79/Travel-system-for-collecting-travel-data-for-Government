name: sih_travel_app
description: A Flutter app to save and display trip details using Firebase Firestore.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase core
  firebase_core: ^4.1.0

  # Cloud Firestore
  cloud_firestore: ^6.0.1

  # Optional: Firebase authentication if needed later
  #firebase_auth: ^5.20.0
  google_sign_in: ^7.2.0

  # UI
  cupertino_icons: ^1.0.5
  intl: ^0.20.2
  qr_flutter: ^4.1.0
  location: ^8.0.1
  firebase_auth: ^6.0.2
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  geolocator: ^14.0.2
  geocoding: ^4.0.0



  #razorpay_flutter: ^1.3.5
  upi_pay: ^1.1.0
  url_launcher: ^6.3.2
  image_picker: ^1.0.4
  mobile_scanner: ^7.0.1
  #flutter_local_notifications: ^19.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
